<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AvatarForge — ИИ-генератор 2D-персонажей</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05060f;
      --surface: #0d101b;
      --surface-hover: #161a29;
      --stroke: rgba(255,255,255,0.08);
      --stroke-hover: rgba(255,255,255,0.2);
      --text: #ffffff;
      --muted: #8b92a5;
      --violet: #7c5cff;
      --cyan: #22d3ee;
      --pink: #ff4ecd;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(124, 92, 255, 0.08), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(34, 211, 238, 0.08), transparent 25%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px 40px;
      border-bottom: 1px solid var(--stroke);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .logo span { color: var(--cyan); }
    .badge { background: rgba(124, 92, 255, 0.15); color: #a894ff; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid rgba(124, 92, 255, 0.3); }

    main {
      flex: 1;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      padding: 40px 20px;
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 40px;
    }

    /* Левая панель управления */
    .controls { display: flex; flex-direction: column; gap: 24px; }
    .control-group label { display: block; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; font-weight: 600; }
    
    .input-wrapper { position: relative; }
    textarea {
      width: 100%;
      height: 100px;
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 12px;
      padding: 15px;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      resize: none;
      outline: none;
      transition: border-color 0.3s;
    }
    textarea:focus { border-color: var(--violet); }

    .style-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .style-btn {
      background: var(--surface);
      border: 1px solid var(--stroke);
      color: var(--text);
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .style-btn:hover { background: var(--surface-hover); border-color: var(--stroke-hover); }
    .style-btn.active { background: rgba(124, 92, 255, 0.15); border-color: var(--violet); color: #c4b5fd; }

    .generate-btn {
      background: linear-gradient(135deg, var(--violet), #4f46e5);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 25px -8px rgba(124, 92, 255, 0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }
    .generate-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 30px -8px rgba(124, 92, 255, 1); }
    .generate-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Правая панель (Результаты) */
    .results-area {
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 24px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 500px;
      position: relative;
    }

    .placeholder { text-align: center; color: var(--muted); }
    .placeholder svg { width: 64px; height: 64px; margin-bottom: 20px; opacity: 0.5; }

    /* Процесс загрузки */
    .loader-container { text-align: center; width: 100%; max-width: 400px; }
    .loader-title { font-family: 'Space Grotesk', sans-serif; font-size: 20px; margin-bottom: 20px; }
    .progress-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; margin-bottom: 20px; }
    .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--cyan), var(--violet)); border-radius: 3px; transition: width 0.3s ease; }
    .status-log { font-size: 14px; color: var(--muted); font-family: monospace; text-align: left; height: 80px; }

    /* Сетка с результатами */
    .image-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; display: none; }
    .img-card { 
      background: #000; 
      border-radius: 16px; 
      overflow: hidden; 
      position: relative; 
      aspect-ratio: 1/1; 
      border: 1px solid var(--stroke);
      transition: transform 0.3s, border-color 0.3s;
    }
    .img-card:hover { transform: scale(1.02); border-color: var(--violet); }
    .img-card img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
    .img-actions { 
      position: absolute; bottom: 0; left: 0; right: 0; 
      padding: 15px; 
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      display: flex; justify-content: center; gap: 10px;
      opacity: 0; transition: opacity 0.3s;
    }
    .img-card:hover .img-actions { opacity: 1; }
    .download-btn { 
      background: rgba(255,255,255,0.2); backdrop-filter: blur(5px);
      color: #fff; border: 1px solid rgba(255,255,255,0.3); 
      padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 600;
    }
    .download-btn:hover { background: rgba(255,255,255,0.3); }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      .image-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Avatar<span>Forge</span></div>
    <div class="badge">AI Beta</div>
  </header>

  <main>
    <!-- Панель управления -->
    <div class="controls">
      <div class="control-group">
        <label>Описание персонажа</label>
        <div class="input-wrapper">
          <textarea id="prompt" placeholder="Например: рыцарь в неоновых доспехах, киберпанк-кот, ведьма с посохом...">Киберпанк-кот с лазерным глазом</textarea>
        </div>
      </div>

      <div class="control-group">
        <label>Стиль графики</label>
        <div class="style-grid" id="styles">
          <button class="style-btn active" data-style="pixel">👾 Пиксель-арт</button>
          <button class="style-btn" data-style="anime">✨ Аниме</button>
          <button class="style-btn" data-style="cartoon">🎨 Мультяшный</button>
          <button class="style-btn" data-style="realistic">🌿 Фэнтези</button>
        </div>
      </div>

      <button class="generate-btn" id="genBtn" onclick="generate()">
        <span>Сгенерировать</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      </button>
    </div>

    <!-- Зона результатов -->
    <div class="results-area" id="resultsArea">
      <div class="placeholder" id="placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        <p>Здесь появятся ваши персонажи.<br>Выберите стиль и нажмите кнопку.</p>
      </div>

      <div class="loader-container" id="loader" style="display: none;">
        <h3 class="loader-title">ИИ создает персонажа...</h3>
        <div class="progress-bar"><div class="progress-fill" id="progressBar"></div></div>
        <div class="status-log" id="statusLog"></div>
      </div>

      <div class="image-grid" id="imageGrid">
        <!-- Сюда будут вставляться картинки -->
      </div>
    </div>
  </main>

  <script>
    let currentStyle = 'pixel';
    
    // Обработка выбора стиля
    document.querySelectorAll('.style-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
        e.target.closest('.style-btn').classList.add('active');
        currentStyle = e.target.closest('.style-btn').dataset.style;
      });
    });

    // Умные модификаторы для нейросети (Prompt Engineering)
    const stylePrompts = {
      pixel: "8-bit pixel art, 16-bit style, crisp pixels, vibrant colors, side view",
      anime: "high quality anime style, studio ghibli, vibrant, cel shading, full body, character design",
      cartoon: "3D cartoon style, Disney Pixar, cute, vibrant, smooth lighting, full body",
      realistic: "fantasy concept art, digital painting, highly detailed, D&D style, full body"
    };

    // Эмуляция логов агента
    const agentSteps = [
      "Анализ текстового запроса...",
      "Выбор стилистических референсов...",
      "Генерация базового слоя (Base Layer)...",
      "Отрисовка деталей и теней...",
      "Финальная очистка фона...",
      "Готово!"
    ];

    async function generate() {
      const userPrompt = document.getElementById('prompt').value.trim();
      if (!userPrompt) return alert('Пожалуйста, опишите персонажа!');

      // UI переключение
      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('imageGrid').style.display = 'none';
      document.getElementById('imageGrid').innerHTML = '';
      document.getElementById('loader').style.display = 'block';
      document.getElementById('genBtn').disabled = true;

      const progressBar = document.getElementById('progressBar');
      const statusLog = document.getElementById('statusLog');
      
      // Сброс прогресс-бара и логов
      progressBar.style.width = '0%';
      statusLog.innerHTML = '';

      // Запускаем красивую анимацию ожидания (от 0 до 90%)
      let step = 0;
      const animationInterval = setInterval(() => {
        if (step < agentSteps.length - 1) {
          statusLog.innerHTML += `> ${agentSteps[step]}<br>`;
          statusLog.scrollTop = statusLog.scrollHeight;
          progressBar.style.width = `${((step + 1) / agentSteps.length) * 100}%`;
          step++;
        }
      }, 800); // Каждые 0.8 секунды новый шаг

      // Формируем идеальный промпт для спрайта
      const finalPrompt = `${userPrompt}, ${stylePrompts[currentStyle]}, game character sprite, full body, isolated on white background, single character, character sheet`;
      
      const encodedPrompt = encodeURIComponent(finalPrompt);
      
      // Генерируем 4 картинки с разными сидами (seed) для вариативности
      const images = [];
      for (let i = 0; i < 4; i++) {
        const seed = Math.floor(Math.random() * 100000);
        const url = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=512&height=512&nologo=true&seed=${seed}`;
        images.push(url);
      }

      // Предзагрузка картинок, чтобы они появились одновременно
      let loadedCount = 0;
      const imageElements = [];

      images.forEach((url, index) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.src = url;
        img.onload = () => {
          loadedCount++;
          imageElements[index] = img;
          
          // Если все 4 загрузились - показываем
          if (loadedCount === 4) {
            clearInterval(animationInterval);
            progressBar.style.width = '100%';
            statusLog.innerHTML += `> ${agentSteps[agentSteps.length-1]}<br>`;
            
            setTimeout(() => {
              document.getElementById('loader').style.display = 'none';
              renderResults(imageElements);
            }, 500);
          }
        };
        img.onerror = () => {
          loadedCount++;
          if (loadedCount === 4) {
            clearInterval(animationInterval);
            document.getElementById('loader').style.display = 'none';
            document.getElementById('placeholder').style.display = 'block';
            document.getElementById('placeholder').innerHTML = '<p style="color:red">Ошибка сети. Попробуйте еще раз.</p>';
            document.getElementById('genBtn').disabled = false;
          }
        }
      });
    }

    function renderResults(images) {
      const grid = document.getElementById('imageGrid');
      grid.style.display = 'grid';
      
      images.forEach((img, i) => {
        const card = document.createElement('div');
        card.className = 'img-card';
        
        const imgTag = document.createElement('img');
        imgTag.src = img.src;
        
        const actions = document.createElement('div');
        actions.className = 'img-actions';
        
        const dlBtn = document.createElement('a');
        dlBtn.className = 'download-btn';
        dlBtn.href = img.src;
        dlBtn.download = `character_${currentStyle}_${i}.jpg`;
        dlBtn.textContent = '⬇ Скачать';
        
        actions.appendChild(dlBtn);
        card.appendChild(imgTag);
        card.appendChild(actions);
        grid.appendChild(card);
      });

      document.getElementById('genBtn').disabled = false;
    }
  </script>
</body>
</html>
