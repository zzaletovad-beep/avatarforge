<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AvatarForge — Генератор игровых персонажей</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #05060f; --surface: #131524; --stroke: rgba(255,255,255,0.1); --text: #e9ebf7; --muted: #9aa1bb; --violet: #7c5cff; --cyan: #22d3ee; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); text-align: center; padding: 40px 20px; min-height: 100vh; }
    h1 { font-family: 'Space Grotesk', sans-serif; font-size: 2.5rem; margin-bottom: 10px; }
    h1 span { color: var(--cyan); }
    .subtitle { color: var(--muted); margin-bottom: 40px; }
    .input-group { margin: 0 auto 40px; max-width: 700px; display: flex; gap: 12px; }
    input { flex: 1; padding: 18px 20px; border-radius: 12px; border: 1px solid var(--stroke); background: var(--surface); color: var(--text); font-size: 16px; outline: none; transition: 0.3s; }
    input:focus { border-color: var(--violet); }
    button { padding: 18px 30px; border: none; border-radius: 12px; background: var(--violet); color: #fff; font-weight: 700; cursor: pointer; font-size: 16px; transition: 0.3s; }
    button:hover { background: #6a4ce0; transform: translateY(-2px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .results { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
    .card { background: var(--surface); border: 1px solid var(--stroke); border-radius: 20px; padding: 24px; width: 100%; max-width: 500px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 400px; position: relative; overflow: hidden; }
    .card h3 { margin-bottom: 20px; color: var(--muted); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
    .img-container { width: 100%; flex: 1; display: flex; align-items: center; justify-content: center; }
    img { max-width: 100%; max-height: 320px; border-radius: 12px; display: none; }
    model-viewer { width: 100%; height: 320px; background: #0b0e14; border-radius: 12px; display: none; }
    .status-text { color: var(--muted); font-size: 14px; line-height: 1.5; padding: 0 20px; }
    .spinner { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--cyan); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .download-btn { margin-top: 15px; padding: 10px 20px; background: rgba(255,255,255,0.05); border: 1px solid var(--stroke); color: var(--text); border-radius: 8px; cursor: pointer; font-size: 14px; text-decoration: none; display: none; }
    .download-btn:hover { background: rgba(255,255,255,0.1); }
    .error { color: #ff6b6b; font-size: 14px; }
  </style>
</head>
<body>

  <h1>Создай своего <span>персонажа</span></h1>
  <p class="subtitle">Введи описание (например: «киберпанк-кот» или «пиксельный рыцарь»)</p>

  <div class="input-group">
    <input type="text" id="prompt" placeholder="Опиши героя..." value="киберпанк-кот">
    <button id="genBtn" onclick="generate()">Сгенерировать</button>
  </div>

  <div class="results">
    <!-- 2D Блок -->
    <div class="card">
      <h3>2D Спрайт (Игровой ассет)</h3>
      <div class="img-container" id="img-container">
        <p class="status-text">Здесь появится 2D-спрайт</p>
      </div>
      <a id="dl-2d" class="download-btn" download="sprite.png">Скачать PNG</a>
    </div>

    <!-- 3D Блок -->
    <div class="card">
      <h3>3D Модель (GLB)</h3>
      <div class="img-container" id="3d-container">
        <p class="status-text">Здесь появится 3D-модель</p>
      </div>
      <a id="dl-3d" class="download-btn" download="model.glb">Скачать GLB</a>
    </div>
  </div>

  <script>
    const btn = document.getElementById('genBtn');
    const imgContainer = document.getElementById('img-container');
    const container3d = document.getElementById('3d-container');
    const dl2d = document.getElementById('dl-2d');
    const dl3d = document.getElementById('dl-3d');

    // Функция для создания правильного промпта спрайта
    function buildSpritePrompt(userPrompt) {
      return `${userPrompt}, game character sprite, full body, centered, solid white background, 2D game asset, clean lines, vector style, isolated on white`;
    }

    async function generate() {
      const userPrompt = document.getElementById('prompt').value.trim();
      if (!userPrompt) return alert('Напиши промпт!');

      // Сброс UI
      btn.disabled = true;
      btn.textContent = 'Генерация...';
      imgContainer.innerHTML = '<div class="spinner"></div><p class="status-text">Рисуем 2D-спрайт...</p>';
      container3d.innerHTML = '<div class="spinner"></div><p class="status-text">Строим 3D-модель (это может занять до 30 сек)...</p>';
      dl2d.style.display = 'none';
      dl3d.style.display = 'none';

      // --- 1. ГЕНЕРАЦИЯ 2D (Pollinations с правильным промптом) ---
      const spritePrompt = buildSpritePrompt(userPrompt);
      const encodedPrompt = encodeURIComponent(spritePrompt);
      const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=512&height=512&nologo=true&seed=${Math.floor(Math.random() * 10000)}`;
      
      const img = new Image();
      img.src = imageUrl;
      img.onload = () => {
        imgContainer.innerHTML = '';
        imgContainer.appendChild(img);
        img.style.display = 'block';
        dl2d.href = imageUrl;
        dl2d.style.display = 'inline-block';
      };
      img.onerror = () => {
        imgContainer.innerHTML = '<p class="error">Ошибка 2D. Попробуй еще раз.</p>';
      };

      // --- 2. ГЕНЕРАЦИЯ 3D (three.ws с повторными попытками) ---
      let success3d = false;
      let attempts = 0;
      const maxAttempts = 4;

      while (attempts < maxAttempts && !success3d) {
        attempts++;
        try {
          // Добавляем случайную задержку перед повторной попыткой
          if (attempts > 1) await new Promise(r => setTimeout(r, 2000 * attempts));

          const response = await fetch('https://three.ws/api/3d/generate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: userPrompt })
          });

          if (response.status === 429) {
            // Сервер перегружен, ждем и пробуем снова
            console.warn(`Попытка ${attempts}: сервер занят, ждем...`);
            continue;
          }

          const data = await response.json();
          
          if (data.glbUrl) {
            container3d.innerHTML = `<model-viewer src="${data.glbUrl}" auto-rotate camera-controls shadow-intensity="1"></model-viewer>`;
            const viewer = container3d.querySelector('model-viewer');
            viewer.style.display = 'block';
            dl3d.href = data.glbUrl;
            dl3d.style.display = 'inline-block';
            success3d = true;
          } else if (data.job_id) {
            // Если модель готовится, ждем и пробуем получить результат
            container3d.innerHTML = '<div class="spinner"></div><p class="status-text">Модель готовится, подождите...</p>';
            await new Promise(r => setTimeout(r, 5000));
            // (В реальном проекте здесь нужно опрашивать статус по job_id, но для MVP упростим)
          }
        } catch (error) {
          console.error(`Ошибка 3D (попытка ${attempts}):`, error);
        }
      }

      if (!success3d) {
        container3d.innerHTML = '<p class="error">3D-сервер перегружен. Попробуйте позже или обновите страницу.</p>';
      }

      btn.disabled = false;
      btn.textContent = 'Сгенерировать';
    }
  </script>
</body>
</html>
