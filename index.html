<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AvatarForge — Живой ИИ-генератор</title>
  <!-- Подключаем 3D-вьювер от Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0b0e14; color: #fff; text-align: center; padding: 40px 20px; }
    h1 { color: #7c5cff; }
    .input-group { margin: 30px auto; max-width: 600px; display: flex; gap: 10px; }
    input { flex: 1; padding: 15px; border-radius: 8px; border: 1px solid #333; background: #1a1d27; color: #fff; font-size: 16px; }
    button { padding: 15px 30px; border: none; border-radius: 8px; background: #7c5cff; color: #fff; font-weight: bold; cursor: pointer; font-size: 16px; }
    button:hover { background: #6a4ce0; }
    .results { display: flex; flex-wrap: wrap; gap: 30px; justify-content: center; margin-top: 40px; }
    .card { background: #1a1d27; border-radius: 16px; padding: 20px; width: 400px; min-height: 400px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .card h3 { margin-top: 0; color: #9aa1bb; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
    img { max-width: 100%; border-radius: 8px; }
    model-viewer { width: 100%; height: 300px; background: #0b0e14; border-radius: 8px; }
    .spinner { border: 4px solid #333; border-top: 4px solid #7c5cff; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .status { font-size: 14px; color: #9aa1bb; margin-top: 10px; }
  </style>
</head>
<body>

  <h1>Создай своего персонажа</h1>
  <p>Введи описание (например: «киберпанк-кот с лазером»)</p>

  <div class="input-group">
    <input type="text" id="prompt" placeholder="Опиши героя..." value="cute cartoon game mascot">
    <button onclick="generate()">Сгенерировать</button>
  </div>

  <div class="results">
    <!-- Блок для 2D-картинки -->
    <div class="card">
      <h3>2D Концепт-арт</h3>
      <div id="img-container">
        <p class="status">Нажми кнопку, чтобы увидеть магию</p>
      </div>
    </div>

    <!-- Блок для 3D-модели -->
    <div class="card">
      <h3>3D Модель (GLB)</h3>
      <div id="3d-container">
        <p class="status">Здесь появится 3D-модель</p>
      </div>
    </div>
  </div>

  <script>
    async function generate() {
      const prompt = document.getElementById('prompt').value;
      if (!prompt) return alert('Напиши промпт!');

      // --- 1. ГЕНЕРАЦИЯ 2D (Pollinations) ---
      const imgContainer = document.getElementById('img-container');
      imgContainer.innerHTML = '<div class="spinner"></div><p class="status">Рисуем 2D...</p>';
      
      // Просто подставляем текст в URL картинки
      const encodedPrompt = encodeURIComponent(prompt);
      const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=512&height=512&nologo=true&seed=${Math.floor(Math.random() * 1000)}`;
      
      // Создаем картинку и ждем, пока она загрузится
      const img = new Image();
      img.src = imageUrl;
      img.onload = () => {
        imgContainer.innerHTML = '';
        imgContainer.appendChild(img);
      };
      img.onerror = () => {
        imgContainer.innerHTML = '<p class="status" style="color:red">Ошибка 2D. Попробуй еще раз.</p>';
      };

      // --- 2. ГЕНЕРАЦИЯ 3D (three.ws) ---
      const container3d = document.getElementById('3d-container');
      container3d.innerHTML = '<div class="spinner"></div><p class="status">Строим 3D (это может занять до 30 сек)...</p>';

      try {
        // Отправляем запрос на бесплатный 3D-API
        const response = await fetch('https://three.ws/api/3d/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: prompt })
        });

        const data = await response.json();
        console.log(data);

        // Проверяем, вернулась ли ссылка на модель
        if (data.glbUrl) {
          // Вставляем 3D-вьювер
          container3d.innerHTML = `
            <model-viewer src="${data.glbUrl}" auto-rotate camera-controls shadow-intensity="1"></model-viewer>
          `;
        } else if (data.job_id) {
            // Если модель долго генерируется, API может вернуть job_id (задачу).
            // В этом простом примере мы просто показываем сообщение, что нужно подождать.
            container3d.innerHTML = '<p class="status">Модель еще готовится. Попробуй нажать кнопку еще раз через 10 секунд.</p>';
        } else {
          container3d.innerHTML = '<p class="status" style="color:orange">3D-сервис сейчас перегружен. 2D-картинка уже готова!</p>';
        }
      } catch (error) {
        console.error(error);
        container3d.innerHTML = '<p class="status" style="color:red">Ошибка 3D. Сервис недоступен.</p>';
      }
    }
  </script>
</body>
</html>
